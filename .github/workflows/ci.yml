name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libmpv-dev libdbus-1-dev

      - name: macOS deps
        if: runner.os == 'macOS'
        run: |
          brew install mpv
          echo "LIBRARY_PATH=$(brew --prefix)/lib" >> "$GITHUB_ENV"

      # libmpv2-sys links `mpv`; MSVC accepts the MinGW import lib renamed to mpv.lib.
      - name: Windows deps
        if: runner.os == 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download -R shinchiro/mpv-winbuild-cmake -p 'mpv-dev-x86_64-2*.7z' -O mpv.7z
          7z x mpv.7z -ompv-dev > /dev/null
          cp mpv-dev/libmpv.dll.a mpv-dev/mpv.lib
          echo "LIB=$(cygpath -w "$PWD/mpv-dev");$LIB" >> "$GITHUB_ENV"
          cygpath -w "$PWD/mpv-dev" >> "$GITHUB_PATH"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2

      - name: Frontend
        working-directory: apps/desktop
        run: |
          bun install --frozen-lockfile
          bun run check
          bun run build

      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
