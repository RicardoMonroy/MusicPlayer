[package]
name = "musicplayer-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "MusicPlayer desktop app"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "musicplayer_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mp-core = { path = "../../../crates/core" }
tauri-plugin-dialog = "2"
mp-local = { version = "0.1.0", path = "../../../crates/providers/local" }
souvlaki = "0.8"
mp-ytmusic = { version = "0.1.0", path = "../../../crates/providers/ytmusic" }
reqwest = "0.12"

