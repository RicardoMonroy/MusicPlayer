[package]
name = "musicplayer-tui"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "musicplayer-tui"
path = "src/main.rs"

[dependencies]
dirs = "6"
mp-core = { path = "../../crates/core" }
mp-local = { version = "0.1.0", path = "../../crates/providers/local" }
mp-ytmusic = { version = "0.1.0", path = "../../crates/providers/ytmusic" }
ratatui = "0.30"
tokio = { version = "1", features = ["rt-multi-thread"] }
